
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b281f">
<title>Para você 🤎</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  font-family: Georgia, "Times New Roman", serif;
  color: #f3e3ce;
  background: #e8d9c9;
}

main {
  width: min(1100px, 100%);
  min-height: calc(100vh - 32px);
  padding: 45px 24px 28px;
  background: #3b281f;
  box-shadow: 0 18px 55px rgba(55, 35, 24, .25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#inicio {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 25px;
}

#inicio h1 {
  font-size: clamp(2rem, 6vw, 3.2rem);
  color: #f3e3ce;
  font-weight: normal;
}

#inicio p {
  font-size: 1.2rem;
  color: #d5bda4;
}

#comecar {
  border: none;
  border-radius: 30px;
  padding: 15px 38px;
  background: #c6a17d;
  color: #3b281f;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  font-family: Arial, sans-serif;
  transition: .2s;
}

#comecar:hover {
  background: #dfc09e;
  transform: translateY(-2px);
}

#conteudo {
  display: none;
  width: 100%;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#message {
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: bold;
  line-height: 1.4;
  max-width: 850px;
  margin: 10px auto 22px;
  color: #f3e3ce;
}

#gif {
  max-width: min(420px, 85vw);
  max-height: 42vh;
  object-fit: contain;
  border-radius: 8px;
}

#gif.black {
  background: #000;
  padding: 10px;
}

@media (max-width: 600px) {
  body {
    padding: 8px;
  }

  main {
    min-height: calc(100vh - 16px);
    padding: 35px 16px 24px;
  }

  #message {
    font-size: clamp(1.2rem, 5vw, 1.6rem);
  }

  #gif {
    max-height: 36vh;
    max-width: 90%;
  }
}
</style>
</head>

<body>

<main>

  <section id="inicio">
    <h1>Para você. 🤎</h1>
    <p>para você.</p>
    <button id="comecar">Começar ♡</button>
  </section>

  <section id="conteudo">
    <p id="message"></p>
    <img id="gif" alt="GIF da lembrança" hidden>
  </section>

</main>

<audio id="music" src="musicas/musica.mp3" loop preload="auto"></audio>

<script>
const pages = [
  ["Lembra que dia é hoje? Não, né, bruxa?", "sabe que dia é hoje.gif"],

  ["Hoje é o dia que completamos 5 meses de namoro!", "5 meses.gif"],

  ["166 dias que eu lançava esse passinho pra te conquistar", "passinho.gif"],

  ["E que nos beijamos pela primeira vez", "dalila.gif"],

  ["Eu mó tímida, sorrindo pra ti, querendo falar contigo, mas eu nem sabia como puxar papo contigo", "com vergonha.gif"],

  ["E tu indo logo em seguida aonde eu estav quando terminei de pensar isso.", "feliz.gif"],

  ["Enquanto o DJ lançava uma pedrada na caixa de som e todos estavam por lá dançando e bebendo", "dj.gif"],

  ["E a gente estava dando uma amassos no banheiro da festa", "dividir.gif"],

  ["E pensamos que ninguém ia suspeitar. Todos suspeitaram, kakakak!", "kiss.gif"],

  ["Até hoje acho engraçado que a gente dormiu a primeira vez juntas por acaso, créditos a Darvilla, akakaaa", "com vergonha.gif"],

  ["Hoje tu fica assim me esperando pra gente dormir juntinhas no calor", "dormir.gif"],

  ["Amo dormir grudada em ti, esses dias o calor tá maltratando a gente", "mim quando nao ver.gif"],

  ["E acho engraçado quando tu conta que alguém ainda não sabia sobre a gente, e descobrem e ficam assim", "chocando.gif"],

  ["E eu assim em casa sabendo que quem namora a gostosa da Salvatore sou eu", "cachorro dancando.gif"],

  ["Eles não terão a imagem de ver tu se maquiando em casa pra gente sair", "vendo ela se arrumar.gif"],

  ["Nem de te ver acordando com vontade de ir pra Salvatore", "querendo ir embora cedo.gif"],

  ["Amo cada detalhe teu, de te mandar docinho as vezes, estou me policiando pra não bagunçar teus treinos", "vergonha.gif"],

  ["De ficar conversando e de conversar nada, simplesmente de estar juntas", "juntes.gif"],

  ["E enquanto eu puder te dar do meu amor, vou te encher dele", "amor pra dar.gif"],

  ["Sei que tu vai fofocar pros nossos filhos que eu terminei contigo, mas eles vão acreditar em mim", "em mim.gif"],

  ["Te amo, muito mozão, e espero que a gente fique juntas pra nossa menstruação sempre ficar na mesma data", "regular.gif"],

  ["Te amo", "absolute.gif"]
];

const inicio = document.getElementById("inicio");
const conteudo = document.getElementById("conteudo");
const message = document.getElementById("message");
const gif = document.getElementById("gif");
const music = document.getElementById("music");

let index = 0;
let timer = null;

function render() {
  const [text, file] = pages[index];

  message.textContent = text;

  gif.hidden = !file;
  gif.classList.toggle("black", file === "dividir.gif");

  gif.onerror = () => {
    gif.hidden = true;
    console.error("GIF não encontrado:", file);
  };

  gif.src = `gif/${file}`;
}

function nextPage() {
  if (index < pages.length - 1) {
    index++;
    render();
  } else {
    clearInterval(timer);
  }
}

document.getElementById("comecar").addEventListener("click", async () => {

  // Inicia a música diretamente pelo clique.
  try {
    await music.play();
  } catch (error) {
    alert("Não foi possível tocar a música. Confira se musica.mp3 está dentro da pasta musicas e se o arquivo está funcionando.");
    console.error("Erro ao iniciar música:", error);
  }

  inicio.style.display = "none";
  conteudo.style.display = "flex";

  index = 0;
  render();

  // Cada lembrança permanece por 9 segundos.
  timer = setInterval(nextPage, 9000);

});
</script>

</body>
</html>
