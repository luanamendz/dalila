
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b281f">
<title>5 meses de nós 🤎</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  font-family: Georgia, "Times New Roman", serif;
  color: #f3e3ce;
  background: #e8d9c9;
}

main {
  width: min(1100px, 100%);
  min-height: calc(100vh - 32px);
  padding: 45px 24px 28px;
  border-radius: 8px;
  background: #3b281f;
  box-shadow: 0 18px 55px rgba(55, 35, 24, .25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

#counter {
  position: absolute;
  top: 20px;
  right: 24px;
  font: 600 13px Arial, sans-serif;
  color: #c6a98b;
}

#message {
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: bold;
  line-height: 1.4;
  max-width: 850px;
  margin: 10px auto 22px;
  color: #f3e3ce;
}

#gif {
  max-width: min(420px, 85vw);
  max-height: 42vh;
  object-fit: contain;
  border-radius: 8px;
}

#gif.black {
  background: #000;
  padding: 10px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-top: 26px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 14px 25px;
  background: #c6a17d;
  color: #3b281f;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  transition: .2s;
  touch-action: manipulation;
}

button:hover {
  background: #dfc09e;
  transform: translateY(-2px);
}

button:active {
  transform: scale(.96);
}

#progress {
  height: 7px;
  width: min(700px, 85%);
  margin-top: 30px;
  background: #604638;
  border-radius: 99px;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0;
  background: #d0ad89;
  transition: width .15s linear;
}

footer {
  margin-top: 22px;
  color: #d5bda4;
  font-size: 15px;
}

#musicButton {
  position: fixed;
  right: 18px;
  bottom: 18px;
  box-shadow: 0 5px 18px rgba(55, 35, 24, .25);
  z-index: 5;
}

@media (max-width: 600px) {
  body {
    padding: 8px;
  }

  main {
    min-height: calc(100vh - 16px);
    padding: 55px 16px 24px;
  }

  #message {
    font-size: clamp(1.2rem, 5vw, 1.6rem);
  }

  #gif {
    max-height: 36vh;
    max-width: 90%;
  }

  .controls {
    gap: 8px;
    margin-top: 22px;
  }

  button {
    padding: 13px 19px;
    font-size: 14px;
  }

  #musicButton {
    right: 12px;
    bottom: 12px;
  }
}
</style>
</head>

<body>

<main>
  <div id="counter">1 / 22</div>

  <p id="message"></p>

  <img id="gif" alt="GIF da lembrança" hidden>

  <div class="controls">
    <button id="prev" aria-label="Página anterior">←</button>
    <button id="toggle">Pausar</button>
    <button id="next" aria-label="Próxima página">→</button>
  </div>

  <div id="progress">
    <div id="bar"></div>
  </div>

  <footer>Com amor, para nós. 🤎</footer>
</main>

<audio id="music" src="assets/musica.mp3" loop preload="auto"></audio>
<button id="musicButton">♫ Tocar música</button>

<script>
const pages = [
  ["Lembra que dia é hoje? Não, né, bruxa?", "sabe que dia é hoje.gif"],
  ["Hoje é o dia que completamos 5 meses de namoro!", "5 meses.gif"],
  ["166 dias que eu lançava esse passinho pra te conquistar", "passinho.gif"],
  ["E que nos beijamos pela primeira vez", "dalila.gif"],
  ["Eu mó tímida, sorrindo pra ti, querendo falar contigo, mas eu nem sabia como puxar papo contigo", "com vergonha.gif"],
  ["E tu indo logo em seguida que terminei de pensar isso. Aonde minha pessoa está?", "feliz.gif"],
  ["Enquanto o DJ lançava uma pedrada na caixa de som e todos estavam por lá dançando e bebendo", "dj.gif"],
  ["E a gente estava dando uma amassos no banheiro da festa", "dividir.gif"],
  ["E pensamos que ninguém ia suspeitar. Todos suspeitaram, kakakak!", "kiss.gif"],
  ["Até hoje acho engraçado que a gente dormiu a primeira vez juntas por acaso, créditos a Darvilla, akakaaa", "com vergonha.gif"],
  ["Hoje tu fica assim me esperando pra gente dormir juntinhas no calor", "dormir.gif"],
  ["Amo dormir grudada em ti, esses dias o calor tá maltratando a gente", "mim quando nao ver.gif"],
  ["E acho engraçado quando tu conta que alguém ainda não sabia sobre a gente, e descobrem e ficam assim", "chocando.gif"],
  ["E eu assim em casa sabendo que quem namora a gostosa da Salvatore sou eu", "cachorro dancando.gif"],
  ["Eles não terão a imagem de ver tu se maquiando em casa pra gente sair", "vendo ela se arrumar.gif"],
  ["Nem de te ver acordando com vontade de ir pra Salvatore", "querendo ir embora cedo.gif"],
  ["Amo cada detalhe teu, de te mandar indiretas às vezes, estou me policiando pra não bagunçar teus treinos", "vergonha.gif"],
  ["De ficar conversando e de conversar nada, simplesmente de estar juntas", "juntes.gif"],
  ["E enquanto eu puder te dar do meu amor, vou te encher dele", "amor pra dar.gif"],
  ["Sei que tu vai fofocar pros nossos filhos que eu terminei contigo, mas eles vão acreditar em mim", "em mim.gif"],
  ["Te amo, muito mozão, e espero que a gente fique juntas pra nossa menstruação sempre ficar na mesma data", "regular.gif"],
  ["Te amo", "absolute.gif"]
];

const message = document.getElementById("message");
const gif = document.getElementById("gif");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const music = document.getElementById("music");
const toggle = document.getElementById("toggle");
const musicButton = document.getElementById("musicButton");

let index = 0;
let playing = true;
let elapsed = 0;
let last = Date.now();

const duration = 5000;

function render() {
  const [text, file] = pages[index];

  message.textContent = text;
  counter.textContent = `${index + 1} / ${pages.length}`;

  gif.hidden = !file;
  gif.classList.toggle("black", file === "dividir.gif");

  gif.onerror = () => {
    gif.hidden = true;
  };

  gif.src = `assets/${file}`;

  elapsed = 0;
  last = Date.now();

  bar.style.width = `${index / pages.length * 100}%`;
}

function go(step) {
  index = Math.max(0, Math.min(pages.length - 1, index + step));

  render();

  if (index === pages.length - 1) {
    playing = false;
    toggle.textContent = "Recomeçar";
  } else {
    playing = false;
    toggle.textContent = "Continuar";
  }
}

document.getElementById("prev").onclick = () => {
  go(-1);
};

document.getElementById("next").onclick = () => {
  go(1);
};

toggle.onclick = () => {
  if (index === pages.length - 1 && !playing) {
    index = 0;
    render();
  }

  playing = !playing;

  toggle.textContent = playing ? "Pausar" : "Continuar";
  last = Date.now();
};

musicButton.onclick = async () => {
  if (music.paused) {
    try {
      await music.play();
      musicButton.textContent = "♫ Pausar música";
    } catch (error) {
      musicButton.textContent = "♫ Tentar tocar música";
      console.error("Não foi possível iniciar a música:", error);
    }
  } else {
    music.pause();
    musicButton.textContent = "♫ Tocar música";
  }
};

setInterval(() => {
  if (!playing) return;

  const now = Date.now();
  elapsed += now - last;
  last = now;

  bar.style.width = `${
    Math.min(100, ((index + elapsed / duration) / pages.length) * 100)
  }%`;

  if (elapsed >= duration) {
    if (index < pages.length - 1) {
      index++;
      render();
    } else {
      playing = false;
      toggle.textContent = "Recomeçar";
    }
  }
}, 100);

render();
</script>

</body>
</html>
