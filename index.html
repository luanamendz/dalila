
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b281f">
<title>5 meses de nós 🤎</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  font-family: Georgia, "Times New Roman", serif;
  color: #f3e3ce;
  background: #e8d9c9;
}

main {
  width: min(1100px, 100%);
  min-height: calc(100vh - 32px);
  padding: 45px 24px 28px;
  background: #3b281f;
  box-shadow: 0 18px 55px rgba(55, 35, 24, .25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

#counter {
  position: absolute;
  top: 20px;
  right: 24px;
  font: 600 13px Arial, sans-serif;
  color: #c6a98b;
}

#message {
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: bold;
  line-height: 1.4;
  max-width: 850px;
  margin: 10px auto 22px;
  color: #f3e3ce;
}

#gif {
  max-width: min(420px, 85vw);
  max-height: 42vh;
  object-fit: contain;
  border-radius: 8px;
}

#gif.black {
  background: #000;
  padding: 10px;
}

#progress {
  height: 7px;
  width: min(700px, 85%);
  margin-top: 30px;
  background: #604638;
  border-radius: 99px;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0;
  background: #d0ad89;
  transition: width .15s linear;
}

footer {
  margin-top: 22px;
  color: #d5bda4;
  font-size: 15px;
}

@media (max-width: 600px) {
  body {
    padding: 8px;
  }

  main {
    min-height: calc(100vh - 16px);
    padding: 55px 16px 24px;
  }

  #message {
    font-size: clamp(1.2rem, 5vw, 1.6rem);
  }

  #gif {
    max-height: 36vh;
    max-width: 90%;
  }
}
</style>
</head>

<body>

<main>
  <div id="counter">1 / 22</div>

  <p id="message"></p>

  <img id="gif" alt="GIF da lembrança" hidden>

  <div id="progress">
    <div id="bar"></div>
  </div>

  <footer>Com amor, para nós. 🤎</footer>
</main>

<audio id="music" src="assets/musica.mp3" loop preload="auto" autoplay></audio>

<script>
const pages = [
  ["Lembra que dia é hoje? Não, né, bruxa?", "sabe que dia é hoje.gif"],
  ["Hoje é o dia que completamos 5 meses de namoro!", "5 meses.gif"],
  ["166 dias que eu lançava esse passinho pra te conquistar", "passinho.gif"],
  ["E que nos beijamos pela primeira vez", "dalila.gif"],
  ["Eu mó tímida, sorrindo pra ti, querendo falar contigo, mas eu nem sabia como puxar papo contigo", "com vergonha.gif"],
  ["E tu indo logo em seguida que terminei de pensar isso. Aonde minha pessoa está?", "feliz.gif"],
  ["Enquanto o DJ lançava uma pedrada na caixa de som e todos estavam por lá dançando e bebendo", "dj.gif"],
  ["E a gente estava dando uma amassos no banheiro da festa", "dividir.gif"],
  ["E pensamos que ninguém ia suspeitar. Todos suspeitaram, kakakak!", "kiss.gif"],
  ["Até hoje acho engraçado que a gente dormiu a primeira vez juntas por acaso, créditos a Darvilla, akakaaa", "com vergonha.gif"],
  ["Hoje tu fica assim me esperando pra gente dormir juntinhas no calor", "dormir.gif"],
  ["Amo dormir grudada em ti, esses dias o calor tá maltratando a gente", "mim quando nao ver.gif"],
  ["E acho engraçado quando tu conta que alguém ainda não sabia sobre a gente, e descobrem e ficam assim", "chocando.gif"],
  ["E eu assim em casa sabendo que quem namora a gostosa da Salvatore sou eu", "cachorro dancando.gif"],
  ["Eles não terão a imagem de ver tu se maquiando em casa pra gente sair", "vendo ela se arrumar.gif"],
  ["Nem de te ver acordando com vontade de ir pra Salvatore", "querendo ir embora cedo.gif"],
  ["Amo cada detalhe teu, de te mandar indiretas às vezes, estou me policiando pra não bagunçar teus treinos", "vergonha.gif"],
  ["De ficar conversando e de conversar nada, simplesmente de estar juntas", "juntes.gif"],
  ["E enquanto eu puder te dar do meu amor, vou te encher dele", "amor pra dar.gif"],
  ["Sei que tu vai fofocar pros nossos filhos que eu terminei contigo, mas eles vão acreditar em mim", "em mim.gif"],
  ["Te amo, muito mozão, e espero que a gente fique juntas pra nossa menstruação sempre ficar na mesma data", "regular.gif"],
  ["Te amo", "absolute.gif"]
];

const message = document.getElementById("message");
const gif = document.getElementById("gif");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const music = document.getElementById("music");

let index = 0;
const duration = 5000;

function render() {
  const [text, file] = pages[index];

  message.textContent = text;
  counter.textContent = `${index + 1} / ${pages.length}`;

  gif.hidden = !file;
  gif.classList.toggle("black", file === "dividir.gif");

  gif.onerror = () => {
    gif.hidden = true;
  };

  gif.src = `assets/${file}`;

  bar.style.width = `${(index / pages.length) * 100}%`;
}

function nextPage() {
  if (index < pages.length - 1) {
    index++;
    render();
  } else {
    bar.style.width = "100%";
    clearInterval(timer);
  }
}

// Tenta iniciar a música automaticamente.
async function startMusic() {
  try {
    await music.play();
    document.removeEventListener("pointerdown", startMusic);
  } catch (error) {
    // Se o navegador bloquear, o primeiro toque inicia a música.
  }
}

document.addEventListener("pointerdown", startMusic);

startMusic();

// Troca os textos e GIFs automaticamente.
render();

const timer = setInterval(nextPage, duration);
</script>

</body>
</html>
